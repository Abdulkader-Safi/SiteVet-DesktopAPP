[package]
name = "sitevet-desktop"
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Abdulkader-Safi/SiteVet-DesktopAPP"

[dependencies]
directories = "6.0.0"
futures = "0.3.34"
gpui-kit = "0.11"
jiff = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "blocking"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sitevet = { version = "0.7", features = ["history", "browser"] }
toml = "1.2.2"

[dev-dependencies]
tempfile = "3.27.0"
