[package]
name = "sitevet-desktop"
version = "0.1.0"
edition = "2024"

[dependencies]
async-channel = "2"
directories = "6.0.0"
futures = "0.3.34"
gpui-kit = "0.11"
jiff = "1"
serde = { version = "1.0.229", features = ["derive"] }
sitevet = { version = "0.7", features = ["history", "browser"] }
toml = "1.2.2"

[dev-dependencies]
serde_json = "1.0.154"
tempfile = "3.27.0"
